name: pipeline1

on:
    push:
        branches:
            - main

jobs:
    run-python-code:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v7
            
            - name: print python version
              run: python --version
            
            - name: setup python version
              uses: actions/setup-python@v7
              with:
                python-version: '3.13' 
            
            - name: run python program
              run: python welcome.py