name: ETL Pipleline

# we will call based on some event
on:
  push:
    branches:
      - main

jobs:
  extract-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7 # action, use
      - name: run python code
        run: python extract.py

  transform-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7 # action, use
      - name: run python code
        run: python transform.py

  load-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7 # action, use
      - name: run python code
        run: python load.py
  